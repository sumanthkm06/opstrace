name: OpsTrace CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            collector/requirements.txt
      - name: Install backend and shared collector dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt -r collector/requirements.txt
      - name: Run backend tests
        run: python -m pytest backend/tests --import-mode=importlib -q

  collector-tests:
    name: Collector tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            collector/requirements.txt
            backend/requirements.txt
      - name: Install collector and integration-test backend dependencies
        run: python -m pip install --disable-pip-version-check -r collector/requirements.txt -r backend/requirements.txt
      - name: Run collector tests
        run: python -m pytest collector/tests --import-mode=importlib -q

  frontend-tests:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test -- --run
      - name: Type-check and build frontend
        run: npm run build

  configuration-validation:
    name: Configuration validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validate Compose, Prometheus, Grafana, and workflow files
        run: python scripts/validate_ci_config.py

  docker-build-validation:
    name: Docker and Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Compose model without resolving secrets
        run: docker compose config --no-interpolate --quiet
      - name: Validate Prometheus configuration
        run: >-
          docker run --rm
          --entrypoint /bin/promtool
          -v "$PWD/infra/prometheus:/etc/prometheus:ro"
          prom/prometheus:v2.48.0
          check config /etc/prometheus/prometheus.yml
      - name: Build backend image
        run: docker build --pull -f backend/Dockerfile -t opstrace-backend:ci .
      - name: Build collector image
        run: docker build --pull -f collector/Dockerfile -t opstrace-collector:ci .
      - name: Build frontend image
        run: docker build --pull -t opstrace-frontend:ci ./frontend
      - name: Build Nginx gateway image
        run: docker build --pull -t opstrace-nginx:ci ./infra/nginx
